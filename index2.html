
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif}
.hdr{background:#1a4b7c;color:#fff;padding:16px 20px;border-radius:10px 10px 0 0}
.hdr-row{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;background:#2e7d32;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;flex-shrink:0}
.hdr h1{font-size:16px;font-weight:600;line-height:1.3}
.hdr p{font-size:11px;opacity:.8;margin-top:2px}
.steps{display:flex;background:#e8f0fa;padding:8px 14px;gap:6px;overflow-x:auto;border:1px solid #c5d5e8;border-top:none}
.step{display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap;color:#666}
.step.active{background:#1a4b7c;color:#fff}
.step.done{background:#2e7d32;color:#fff}
.step-num{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.body{padding:18px 18px 14px;background:var(--color-background-primary);border:1px solid #c5d5e8;border-top:none;border-radius:0 0 10px 10px}
.sec-title{font-size:13px;font-weight:600;color:#1a4b7c;border-bottom:2px solid #e8f0fa;padding-bottom:5px;margin-bottom:12px}
.lbl{font-size:12px;font-weight:500;color:#1a4b7c;margin-bottom:4px;display:block}
.inp{width:100%;padding:9px 11px;border:1.5px solid #c5d5e8;border-radius:7px;font-size:14px;outline:none;transition:border .15s;background:var(--color-background-primary);color:var(--color-text-primary)}
.inp:focus{border-color:#1a4b7c}
.ro{background:#f0f5fb;border:1.5px solid #c5d5e8;border-radius:7px;padding:8px 11px;font-size:13px;color:var(--color-text-secondary);min-height:34px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.mb12{margin-bottom:12px}
.mb16{margin-bottom:16px}
.card{background:#f7f9fc;border:1px solid #d6e4f0;border-radius:8px;padding:14px;margin-bottom:14px}
.btn-pri{background:#1a4b7c;color:#fff;border:none;padding:11px 20px;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;width:100%;margin-top:6px}
.btn-pri:hover{background:#15396b}
.btn-pri.green{background:#2e7d32}
.btn-pri.green:hover{background:#246027}
.btn-out{background:var(--color-background-primary);color:#1a4b7c;border:2px solid #1a4b7c;padding:9px 16px;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer}
.btn-out:hover{background:#e8f0fa}
.err{background:#fef2f2;border:1px solid #fca5a5;border-radius:7px;padding:9px 12px;color:#c0392b;font-size:12px;margin-bottom:10px}
.info{background:#f0f5fb;border-radius:7px;padding:10px 12px;font-size:12px;color:#1a4b7c;margin-bottom:12px;line-height:1.6}
.warn{background:#fffbeb;border:1px solid #fcd34d;border-radius:7px;padding:10px 12px;font-size:12px;color:#92400e;margin-bottom:12px;line-height:1.6}
.ok{background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:14px;margin-bottom:14px}
.fecha-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.fecha-btn{padding:9px 12px;border-radius:7px;border:1.5px solid #c5d5e8;background:var(--color-background-primary);cursor:pointer;font-size:12px;font-weight:500;color:var(--color-text-secondary);text-align:left;line-height:1.4;transition:all .15s}
.fecha-btn.sel{border:2px solid #1a4b7c;background:#e8f0fa;color:#0c447c}
.jornada-row{display:flex;gap:10px;margin-bottom:14px}
.jorn-btn{flex:1;padding:12px 8px;border-radius:8px;border:1.5px solid #c5d5e8;background:var(--color-background-primary);cursor:pointer;font-weight:600;font-size:13px;color:var(--color-text-secondary);text-align:center;transition:all .15s}
.jorn-btn.sel{border:2px solid #1a4b7c;background:#e8f0fa;color:#0c447c}
.slots-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}
.slot{padding:7px 4px;border-radius:7px;border:1.5px solid #c5d5e8;background:var(--color-background-primary);cursor:pointer;font-size:12px;font-weight:500;color:var(--color-text-primary);text-align:center;transition:all .1s;line-height:1.4}
.slot.sel{border:2px solid #2e7d32;background:#dcfce7;color:#166534}
.slot.full{border:1.5px solid #fca5a5;background:#fef2f2;color:#c0392b;cursor:not-allowed;opacity:.75}
.slot:not(.full):not(.sel):hover{border-color:#1a4b7c;background:#e8f0fa}
.tag-pend{display:inline-block;background:#fff7ed;color:#c2410c;border-radius:20px;padding:2px 9px;font-size:11px}
.tag-ok{display:inline-block;background:#dcfce7;color:#166534;border-radius:20px;padding:2px 9px;font-size:11px}
.check-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.check-row input{margin-top:2px;flex-shrink:0;width:15px;height:15px;cursor:pointer}
.check-row label{font-size:12px;color:var(--color-text-secondary);cursor:pointer;line-height:1.5}
.sum-row{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #e8f0fa;font-size:12px}
.sum-k{color:#1a4b7c;font-weight:500;min-width:140px;flex-shrink:0}
.sum-v{color:var(--color-text-primary)}
.eval-list{font-size:11px;color:var(--color-text-secondary);line-height:1.8;margin-top:4px}
.success-icon{width:56px;height:56px;background:#dcfce7;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 10px}
.btn-row{display:flex;gap:10px}
.footer{text-align:center;font-size:10px;color:#999;margin-top:10px}
textarea.inp{min-height:72px;resize:vertical}
</style>

let state={step:1,cedula:"",emp:null,fecha:"",jornada:"",hora:"",correo:"",celular:"",obs:"",autoriza:false,err:"",slotCounts:{},loadingSlots:false,reservaId:"",submitting:false};

function tc(s){return s?s.toLowerCase().replace(/\b(\w)/g,c=>c.toUpperCase()):"";}
function sk(f,h){return"slot:"+f+":"+h;}

async function loadSlots(f){
  state.loadingSlots=true; render();
  const all=[...MANANA,...TARDE]; const c={};
  await Promise.all(all.map(async h=>{
    try{const r=await window.storage.get(sk(f,h),true);c[h]=r?JSON.parse(r.value).length:0;}catch{c[h]=0;}
  }));
  state.slotCounts=c; state.loadingSlots=false; render();
}

async function confirm(){
  if(!state.autoriza){state.err="Debe aceptar la autorización de datos personales.";render();return;}
  state.err=""; state.submitting=true; render();
  const key=sk(state.fecha,state.hora);
  const rid="RES-"+Date.now()+"-"+state.cedula.slice(-4);
  try{
    let arr=[];
    try{const r=await window.storage.get(key,true);if(r)arr=JSON.parse(r.value);}catch{}
    if(arr.length>=MAX){state.err="Horario lleno. Seleccione otro.";state.submitting=false;state.step=2;render();return;}
    const res={id:rid,cedula:state.cedula,nombre:state.emp.n,cargo:state.emp.c,evaluaciones:state.emp.ev,fecha:state.fecha,hora:state.hora,jornada:state.jornada,correo:state.correo,celular:state.celular,obs:state.obs,ts:new Date().toISOString()};
    arr.push(res);
    await window.storage.set(key,JSON.stringify(arr),true);
    let todas=[];
    try{const r=await window.storage.get("reservas:all",true);if(r)todas=JSON.parse(r.value);}catch{}
    todas.push(res);
    await window.storage.set("reservas:all",JSON.stringify(todas),true);
    state.reservaId=rid; state.step=5;
  }catch(e){state.err="Error al guardar. Intente de nuevo.";}
  state.submitting=false; render();
}

function reset(){state={step:1,cedula:"",emp:null,fecha:"",jornada:"",hora:"",correo:"",celular:"",obs:"",autoriza:false,err:"",slotCounts:{},loadingSlots:false,reservaId:"",submitting:false};render();}

        <button class="jorn-btn ${state.jornada==='mañana'?'sel':''}" id="jMa">
          <i class="ti ti-sun" aria-hidden="true" style="font-size:18px;display:block;margin-bottom:3px"></i>
          Mañana<br><span style="font-size:11px;font-weight:400">8:00 a.m. – 12:00 m.</span>
        </button>
        <button class="jorn-btn ${state.jornada==='tarde'?'sel':''}" id="jTa">
          <i class="ti ti-sunset" aria-hidden="true" style="font-size:18px;display:block;margin-bottom:3px"></i>
          Tarde<br><span style="font-size:11px;font-weight:400">1:00 p.m. – 5:00 p.m.</span>
        </button>
      </div>`:''}
      ${state.jornada?`
      <div class="sec-title">Horarios disponibles ${state.loadingSlots?'<span style="font-size:11px;color:#888">cargando...</span>':''}</div>
      <div class="slots-grid">
        ${horasActuales.map(h=>{
          const cnt=state.slotCounts[h]||0;
          const full=cnt>=MAX;
          const sel=state.hora===h;
          return `<button class="slot ${sel?'sel':full?'full':''}" data-hora="${h}" ${full?'disabled':''}>
            ${h} ${state.jornada==='tarde'?'p.m.':'a.m.'}<br>
            <span style="font-size:10px">${full?'Lleno':(MAX-cnt)+' cupo'+(MAX-cnt!==1?'s':'')}</span>
          </button>`;
        }).join('')}
      </div>`:''}
      ${state.err?`<div class="err">${state.err}</div>`:''}
      <div class="btn-row">
        <button class="btn-out" id="btnAtras2">← Atrás</button>
        <button class="btn-pri" id="btnSig2" style="flex:1;margin-top:0">Continuar →</button>
      </div>
    </div>`;
  }

  else if(state.step===3){
    html+=`<div class="body">
      <div class="sec-title">Datos de contacto</div>
      <div class="mb12"><label class="lbl">Correo electrónico para confirmación <span style="color:#c0392b">*</span></label>
      <input class="inp" id="correo" type="email" placeholder="ejemplo@correo.com" value="${state.correo}"></div>
      <div class="mb12"><label class="lbl">Celular <span style="color:#888;font-weight:400">(opcional)</span></label>
      <input class="inp" id="cel" type="tel" placeholder="Ej: 3001234567" value="${state.celular}"></div>
      <div class="mb16"><label class="lbl">Observaciones <span style="color:#888;font-weight:400">(opcional)</span></label>
      <textarea class="inp" id="obs" placeholder="Condición médica relevante u observación...">${state.obs}</textarea></div>
      ${state.err?`<div class="err">${state.err}</div>`:''}
      <div class="btn-row">
        <button class="btn-out" id="btnAtras3">← Atrás</button>
        <button class="btn-pri" id="btnSig3" style="flex:1;margin-top:0">Continuar →</button>
      </div>
    </div>`;
  }

  else if(state.step===4){
    const evItems2=state.emp.ev.split("*").filter(Boolean).map(e=>`<div>• ${e.trim()}</div>`).join('');
    const rows=[
      ["Cédula",state.cedula],["Nombre completo",tc(state.emp.n)],["Cargo",tc(state.emp.c)],
      ["Fecha",fechaLbl],["Jornada",state.jornada==="mañana"?"Mañana (8:00 a.m. – 12:00 m.)":"Tarde (1:00 p.m. – 5:00 p.m.)"],
      ["Hora",state.hora+" "+(state.jornada==="mañana"?"a.m.":"p.m.")],["Correo",state.correo],
      ...(state.celular?[["Celular",state.celular]]:[])
    ];
    html+=`<div class="body">
      <div class="sec-title">Resumen de su cita</div>
      <div class="card">
        ${rows.map(([k,v])=>`<div class="sum-row"><span class="sum-k">${k}:</span><span class="sum-v">${v}</span></div>`).join('')}
        <div style="padding:8px 0 0"><span class="sum-k" style="font-size:12px;color:#1a4b7c;font-weight:500">Evaluaciones:</span><div class="eval-list">${evItems2}</div></div>
      </div>
      <div class="warn"><i class="ti ti-alert-triangle" aria-hidden="true" style="font-size:13px;margin-right:4px"></i>Recibirá confirmación por correo. El día del examen traiga su documento de identidad y llegue 10 minutos antes.</div>
      <div class="check-row">
        <input type="checkbox" id="aut" ${state.autoriza?"checked":""}>
        <label for="aut"><strong>Autorización de datos:</strong> Autorizo el tratamiento de mis datos personales para fines relacionados con la programación y gestión de exámenes médicos ocupacionales, conforme a la Ley 1581 de 2012.</label>
      </div>
      ${state.err?`<div class="err">${state.err}</div>`:''}
      <div class="btn-row">
        <button class="btn-out" id="btnAtras4">← Atrás</button>
        <button class="btn-pri green" id="btnConfirmar" style="flex:1;margin-top:0" ${state.submitting?"disabled":""}>
          ${state.submitting?'Procesando...':'<i class="ti ti-check" aria-hidden="true" style="margin-right:4px"></i> Confirmar cita'}
        </button>
      </div>
    </div>`;
  }

  else if(state.step===5){
    html+=`<div class="body">
      <div style="text-align:center;padding:16px 0 10px">
        <div class="success-icon"><i class="ti ti-circle-check" aria-hidden="true" style="font-size:30px;color:#166534"></i></div>
        <p style="font-size:17px;font-weight:600;color:#166534;margin-bottom:4px">¡Cita agendada exitosamente!</p>
        <p style="font-size:12px;color:var(--color-text-secondary)">Su reserva ha sido registrada en el sistema</p>
      </div>
      <div class="ok">
        <div style="font-weight:600;font-size:13px;color:#166534;margin-bottom:8px">Detalles de su cita</div>
        ${[["N° reserva",state.reservaId],["Nombre",tc(state.emp.n)],["Fecha",fechaLbl],["Hora",state.hora+" "+(state.jornada==="mañana"?"a.m.":"p.m.")],["Correo",state.correo]].map(([k,v])=>`<div class="sum-row" style="border-color:#bbf7d0"><span class="sum-k" style="color:#166534">${k}:</span><span class="sum-v" style="color:#14532d">${v}</span></div>`).join('')}
      </div>
      <div class="info" style="line-height:1.8">
        <i class="ti ti-mail" aria-hidden="true" style="font-size:13px;margin-right:4px"></i>Confirmación enviada a <strong>${state.correo}</strong><br>
        <i class="ti ti-id-badge" aria-hidden="true" style="font-size:13px;margin-right:4px"></i>Traiga su documento de identidad el día del examen.<br>
        <i class="ti ti-phone" aria-hidden="true" style="font-size:13px;margin-right:4px"></i>Para modificaciones contacte a Gestión Humana.
      </div>
      <button class="btn-pri" id="btnNueva">Agendar otra cita</button>
    </div>`;
  }

  html+=`<div class="footer">Gestión Humana · Salud y Seguridad en el Trabajo · Sistema de Agendamiento v1.0</div></div>`;
  document.getElementById("app").innerHTML=html;
  bindEvents();
}

function bindEvents(){
  const $=id=>document.getElementById(id);
  const on=(id,ev,fn)=>{const el=$(id);if(el)el.addEventListener(ev,fn);};

  if(state.step===1){
    const inp=$("ced");
    if(inp){inp.focus();inp.addEventListener("keydown",e=>{if(e.key==="Enter")buscar();});}
    on("btnBuscar","click",buscar);
  }
  if(state.step===2){
    document.querySelectorAll(".fecha-btn").forEach(b=>b.addEventListener("click",()=>{
      state.fecha=b.dataset.fecha;state.jornada="";state.hora="";state.err="";
      loadSlots(state.fecha);render();
    }));
    on("jMa","click",()=>{state.jornada="mañana";state.hora="";state.err="";render();});
    on("jTa","click",()=>{state.jornada="tarde";state.hora="";state.err="";render();});
    document.querySelectorAll(".slot:not([disabled])").forEach(b=>b.addEventListener("click",()=>{
      state.hora=b.dataset.hora;state.err="";render();
    }));
    on("btnAtras2","click",()=>{state.step=1;state.emp=null;state.err="";render();});
    on("btnSig2","click",()=>{
      if(!state.fecha){state.err="Seleccione una fecha.";render();return;}
      if(!state.jornada){state.err="Seleccione una jornada.";render();return;}
      if(!state.hora){state.err="Seleccione un horario.";render();return;}
      state.err="";state.step=3;render();
    });
  }
  if(state.step===3){
    on("btnAtras3","click",()=>{state.step=2;state.err="";render();});
    on("btnSig3","click",()=>{
      state.correo=($("correo")||{}).value||"";
      state.celular=($("cel")||{}).value||"";
      state.obs=($("obs")||{}).value||"";
      if(!state.correo||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.correo)){state.err="Ingrese un correo electrónico válido.";render();return;}
      state.err="";state.step=4;render();
    });
  }
  if(state.step===4){
    on("btnAtras4","click",()=>{state.step=3;state.err="";render();});
    on("aut","change",e=>{state.autoriza=e.target.checked;});
    on("btnConfirmar","click",confirm);
  }
  if(state.step===5){
    on("btnNueva","click",reset);
  }
}

function buscar(){
  state.cedula=(document.getElementById("ced")||{}).value||"";
  const c=state.cedula.trim();
  if(!c){state.err="Por favor ingrese su número de cédula.";render();return;}
  const emp=EMPLEADOS[c];
  if(!emp){state.err="Cédula no encontrada. Verifique el número o contacte a Gestión Humana.";render();return;}
  state.err="";state.emp=emp;state.step=2;render();
}

render();
</script>
