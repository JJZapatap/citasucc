

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f0f4f8}
.wrap{max-width:660px;margin:0 auto;font-family:system-ui,sans-serif}
.hdr{background:linear-gradient(135deg,#1a4b7c,#1e5c9a);color:#fff;padding:16px 20px;border-radius:12px 12px 0 0}
.hdr-row{display:grid;grid-template-columns:70px 1fr 70px;align-items:center;gap:12px}
.logo-box{width:58px;height:58px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:50%;padding:5px;box-shadow:0 2px 8px rgba(0,0,0,.22);font-weight:800;color:#2e7d32;font-size:15px;overflow:hidden}
.logo-ucc{width:100%;height:100%;object-fit:contain;display:block}
.hdr-text{text-align:center}
.hdr h1{font-size:15px;font-weight:700;line-height:1.3;margin:0}
.hdr p{font-size:11px;opacity:.9;margin:3px 0 0}
.hdr-spacer{width:58px;height:58px}
.steps{display:flex;background:#dce8f5;padding:8px 14px;gap:4px;overflow-x:auto;border-left:1px solid #b8d0ea;border-right:1px solid #b8d0ea}
.step{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;color:#7a9cbf;transition:all .2s}
.step.active{background:#1a4b7c;color:#fff}
.step.done{background:#2e7d32;color:#fff}
.sn{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.body{padding:18px 18px 14px;background:#fff;border:1px solid #b8d0ea;border-top:none;border-radius:0 0 12px 12px}
.stitle{font-size:13px;font-weight:700;color:#1a4b7c;border-bottom:2px solid #dce8f5;padding-bottom:6px;margin-bottom:13px;display:flex;align-items:center;gap:6px}
.lbl{font-size:12px;font-weight:600;color:#2c5282;margin-bottom:4px;display:block}
.inp{width:100%;padding:9px 12px;border:1.5px solid #c5d5e8;border-radius:8px;font-size:13px;outline:none;background:#fff;color:#1a202c;transition:border .15s}
.inp:focus{border-color:#1a4b7c;box-shadow:0 0 0 3px rgba(26,75,124,.1)}
textarea.inp{min-height:70px;resize:vertical}
.ro{background:#eef4fb;border:1.5px solid #c5d5e8;border-radius:8px;padding:9px 12px;font-size:12px;color:#2d3748;min-height:34px;line-height:1.7}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.mb{margin-bottom:12px}
.card{background:#f7fafd;border:1px solid #c5d5e8;border-radius:10px;padding:14px;margin-bottom:14px}
.bp{background:linear-gradient(135deg,#1a4b7c,#1e5c9a);color:#fff;border:none;padding:11px 20px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;width:100%;margin-top:6px;transition:opacity .15s;letter-spacing:.3px}
.bp:hover{opacity:.9}
.bp.g{background:linear-gradient(135deg,#2e7d32,#388e3c)}
.bp:disabled{background:#9cb3c9;cursor:not-allowed}
.bo{background:#fff;color:#1a4b7c;border:2px solid #1a4b7c;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.bo:hover{background:#eef4fb}
.err{background:#fff5f5;border:1.5px solid #fc8181;border-radius:8px;padding:9px 12px;color:#c53030;font-size:12px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.info{background:#ebf4ff;border:1px solid #bee3f8;border-radius:8px;padding:10px 12px;font-size:12px;color:#2b6cb0;margin-bottom:12px;line-height:1.7}
.warn{background:#fffbeb;border:1px solid #f6e05e;border-radius:8px;padding:10px 12px;font-size:12px;color:#744210;margin-bottom:12px;line-height:1.7}
.ok{background:#f0fff4;border:1.5px solid #68d391;border-radius:10px;padding:14px;margin-bottom:14px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.fb{padding:10px 12px;border-radius:8px;border:1.5px solid #c5d5e8;background:#fff;cursor:pointer;font-size:12px;font-weight:600;color:#4a5568;text-align:left;line-height:1.4;transition:all .15s}
.fb:hover{border-color:#1a4b7c;background:#eef4fb}
.fb.sel{border:2px solid #1a4b7c;background:#dce8f5;color:#1a4b7c}
.jr{display:flex;gap:10px;margin-bottom:14px}
.jb{flex:1;padding:12px 8px;border-radius:10px;border:1.5px solid #c5d5e8;background:#fff;cursor:pointer;font-weight:700;font-size:13px;color:#4a5568;text-align:center;transition:all .15s}
.jb:hover{border-color:#1a4b7c;background:#eef4fb}
.jb.sel{border:2px solid #1a4b7c;background:#dce8f5;color:#1a4b7c}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.sb{padding:8px 4px;border-radius:8px;border:1.5px solid #c5d5e8;background:#fff;cursor:pointer;font-size:11px;font-weight:600;color:#2d3748;text-align:center;transition:all .1s;line-height:1.5}
.sb.sel{border:2px solid #2e7d32;background:#c6f6d5;color:#22543d}
.sb.full{border:1.5px solid #fc8181;background:#fff5f5;color:#c53030;cursor:not-allowed;opacity:.7}
.sb:not(.full):not(.sel):hover{border-color:#1a4b7c;background:#eef4fb}
.cr{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;background:#f7fafd;border:1px solid #c5d5e8;border-radius:8px;padding:12px}
.cr input{margin-top:2px;flex-shrink:0;width:16px;height:16px;cursor:pointer;accent-color:#1a4b7c}
.cr label{font-size:12px;color:#2d3748;cursor:pointer;line-height:1.6}
.sr{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid #e2ecf5;font-size:12px}
.sk{color:#1a4b7c;font-weight:700;min-width:150px;flex-shrink:0}
.brow{display:flex;gap:10px;margin-top:4px}
.tag-p{display:inline-block;background:#fef3c7;color:#92400e;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:600}
.sico{width:60px;height:60px;background:#c6f6d5;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 10px;box-shadow:0 2px 10px rgba(46,125,50,.2)}
.foot{text-align:center;font-size:10px;color:#90a4ae;margin-top:10px;padding-bottom:4px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes sp{to{transform:rotate(360deg)}}
.badge-slot{display:inline-block;background:#e8f5e9;color:#2e7d32;border-radius:12px;padding:1px 7px;font-size:10px;font-weight:600;margin-left:4px}
.progress{height:3px;background:#dce8f5;margin-bottom:0;border-radius:0}
.progress-bar{height:3px;background:linear-gradient(90deg,#1a4b7c,#2e7d32);border-radius:0;transition:width .3s}
@media(max-width:560px){
  .hdr-row{grid-template-columns:54px 1fr 54px;gap:8px}
  .logo-box{width:48px;height:48px;font-size:13px}
  .hdr-spacer{width:48px;height:48px}
  .hdr h1{font-size:13px}
  .hdr p{font-size:10px}
}
</style>

// ✅ Corrección para GitHub Pages:
// window.storage solo existe en algunos entornos de prueba.
// En GitHub Pages no existe, por eso fallaba: Cannot read properties of undefined (reading 'set').
// Este adaptador usa localStorage para evitar el error y permitir guardar la reserva en el navegador.
if (!window.storage) {
  window.storage = {
    async get(key, shared = false) {
      const value = localStorage.getItem(key);
      return value === null ? null : { key, value };
    },
    async set(key, value, shared = false) {
      localStorage.setItem(key, value);
      return { key, value };
    },
    async delete(key, shared = false) {
      localStorage.removeItem(key);
      return true;
    }
  };
}

function tc(s){return(s||"").toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());}
function pct(step){return Math.round((step-1)/4*100);}
function fmtHora(h){
  h=String(h||'').trim();
  const m=h.match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return h;
  let hh=Number(m[1]);
  const mm=m[2];
  if(hh===0) hh=12;
  else if(hh>12) hh-=12;
  return `${hh}:${mm}`;
}

function apiCall(params){
  return new Promise((resolve,reject)=>{
    if(!API_URL || API_URL.includes("PEGUE_AQUI")){
      reject(new Error("Falta configurar API_URL con la URL /exec de Google Apps Script"));
      return;
    }

    const cb="cbReservas_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const qs=new URLSearchParams({...params,callback:cb});
    const script=document.createElement("script");
    const timer=setTimeout(()=>{
      cleanup();
      reject(new Error("No respondió Google Sheets. Revise la URL de Apps Script"));
    },15000);

    function cleanup(){
      clearTimeout(timer);
      delete window[cb];
      if(script.parentNode) script.parentNode.removeChild(script);
    }

    window[cb]=(data)=>{
      cleanup();
      resolve(data);
    };

    script.onerror=()=>{
      cleanup();
      reject(new Error("No se pudo conectar con Google Apps Script"));
    };

    script.src=API_URL+"?"+qs.toString();
    document.body.appendChild(script);
  });
}

async function loadCounts(f){
  S.loadingSlots=true; R();
  try{
    const res=await apiCall({action:"counts",fecha:f});
    S.counts=(res&&res.ok&&res.counts)?res.counts:{};
  }catch(e){
    console.warn("No se pudieron cargar cupos:",e);
    S.counts={};
  }
  S.loadingSlots=false; R();
}

function textoCitaActiva(r){
  const fecha = r && r.fecha ? r.fecha : '';
  const hora = r && r.hora ? r.hora : '';
  const jornada = r && r.jornada ? r.jornada : '';
  const reserva = r && r.reserva ? r.reserva : '';
  return `Esta cédula ya tiene una cita activa${fecha || hora ? ` para ${fecha} ${fmtHora(hora)}` : ''}${jornada ? ` (${jornada})` : ''}${reserva ? `. N° reserva: ${reserva}` : ''}. Para agendar una nueva cita, primero debe cancelar la cita actual.`;
}

async function validarCitaActivaPorCedula(cedula){
  const res = await apiCall({action:"active", cedula:cedula});
  if(!res || !res.ok){
    throw new Error((res && res.error) ? res.error : "No fue posible validar si la cédula ya tiene cita activa.");
  }
  return res;
}

async function save(){
  if(!S.auth){S.err="Debe aceptar la autorización de datos personales.";R();return;}
  S.err=""; S.saving=true; R();
  const rid="RES-"+Date.now()+"-"+S.cedula.slice(-4);

  try{
    const res=await apiCall({
      action:"reserve",
      max:MAX,
      id:rid,
      cedula:S.cedula,
      nombre:S.emp.n,
      cargo:S.emp.c,
      evaluaciones:S.emp.ev,
      fecha:S.fecha,
      hora:S.hora,
      jornada:S.jornada,
      correo:S.correo,
      celular:S.celular||"",
      obs:S.obs||""
    });

    if(!res || !res.ok){
      throw new Error((res&&res.error)?res.error:"No se pudo registrar la reserva.");
    }

    S.rid=res.rid||rid;
    if(res.counts) S.counts=res.counts;
    S.step=5;
  }catch(e){
    S.err="Error al guardar: "+e.message;
  }

  S.saving=false; R();
}

async function cancelReservation(){
  const ced=(document.getElementById("cancelCed")||{}).value||"";
  const motivo=(document.getElementById("cancelMotivo")||{}).value||"";

  const c=ced.trim();

  if(!c){
    S.cancelOk=false;
    S.cancelMsg="Ingrese la cédula para cancelar la cita activa.";
    R();
    return;
  }

  if(!confirm("¿Confirma que desea cancelar la cita asociada a la cédula " + c + "? El cupo volverá a quedar disponible.")){
    return;
  }

  S.cancelMsg="";
  S.cancelOk=false;
  S.cancelling=true;
  R();

  try{
    const res=await apiCall({
      action:"cancel",
      cedula:c,
      motivo:motivo.trim()
    });

    if(!res || !res.ok){
      throw new Error((res&&res.error)?res.error:"No se pudo cancelar la cita.");
    }

    S.cancelOk=true;
    S.cancelMsg=(res.message||"Cita cancelada correctamente.")+(res.fecha&&res.hora?` Fecha: ${res.fecha}, hora: ${res.hora}.`:"");
  }catch(e){
    S.cancelOk=false;
    S.cancelMsg="Error al cancelar: "+e.message;
  }

  S.cancelling=false;
  R();
}

    <div class="ok">
      <div style="font-weight:700;font-size:13px;color:#276749;margin-bottom:9px">📋 Comprobante de cita</div>
      ${[["🆔 N° reserva",S.rid],["👤 Nombre",tc(S.emp.n)],["📅 Fecha",fLbl],["🕐 Hora",fmtHora(S.hora)+" "+(S.jornada==="mañana"?"a.m.":"p.m.")],["⏰ Jornada",S.jornada==="mañana"?"Mañana":"Tarde"],["📧 Correo",S.correo]].map(([k,v])=>`<div class="sr" style="border-color:#9ae6b4"><span class="sk" style="color:#276749">${k}:</span><span style="color:#22543d;font-weight:600">${v}</span></div>`).join('')}
    </div>
    <div class="info" style="line-height:2">
      📧 <strong>Confirmación enviada a:</strong> ${S.correo}<br>
      🗂️ <strong>Registro guardado en Google Sheets</strong> — Gestión Humana tiene acceso a su cita.<br>
      🪪 Traiga su documento de identidad el día del examen.<br>
      ❌ Si necesita cancelar, use la opción <strong>Cancelar cita registrada</strong> en la pantalla inicial ingresando únicamente su cédula.
    </div>
    <button class="bp" id="bNueva" style="background:linear-gradient(135deg,#1a4b7c,#1e5c9a)">Agendar otra cita</button>
  </div>`;}

  h+=`<div class="foot">Gestión Humana · Salud y Seguridad en el Trabajo · v8.0 — Google Sheets + Cupos dinámicos + Única cita activa por cédula</div></div>`;
  document.getElementById("app").innerHTML=h;
  bind();
}

function bind(){
  const g=id=>document.getElementById(id);
  const on=(id,ev,fn)=>{const el=g(id);if(el)el.addEventListener(ev,fn);};

  if(S.step===1){
    const inp=g("ced");
    if(inp){inp.focus();inp.addEventListener("keydown",e=>{if(e.key==="Enter")buscar();});}
    on("b1","click",buscar);
    on("bCancel","click",cancelReservation);
  }
  if(S.step===2){
    document.querySelectorAll(".fb").forEach(b=>b.addEventListener("click",()=>{
      S.fecha=b.dataset.f; S.jornada=""; S.hora=""; S.err="";
      loadCounts(S.fecha); R();
    }));
    on("jM","click",()=>{S.jornada="mañana";S.hora="";S.err="";R();});
    on("jT","click",()=>{S.jornada="tarde";S.hora="";S.err="";R();});
    document.querySelectorAll(".sb:not([disabled])").forEach(b=>b.addEventListener("click",()=>{S.hora=b.dataset.h;S.err="";R();}));
    on("bA2","click",()=>{S.step=1;S.emp=null;S.err="";R();});
    on("bS2","click",()=>{
      if(!S.fecha){S.err="Seleccione una fecha.";R();return;}
      if(!S.jornada){S.err="Seleccione una jornada.";R();return;}
      if(!S.hora){S.err="Seleccione un horario disponible.";R();return;}
      S.err="";S.step=3;R();
    });
  }
  if(S.step===3){
    on("bA3","click",()=>{S.step=2;S.err="";R();});
    on("bS3","click",()=>{
      S.correo=(g("cor")||{}).value||"";
      S.celular=(g("cel")||{}).value||"";
      S.obs=(g("obs")||{}).value||"";
      if(!S.correo||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.correo)){S.err="Ingrese un correo electrónico válido.";R();return;}
      S.err="";S.step=4;R();
    });
  }
  if(S.step===4){
    on("bA4","click",()=>{S.step=3;S.err="";R();});
    on("aut","change",e=>{S.auth=e.target.checked;});
    on("bOK","click",save);
  }
  if(S.step===5){on("bNueva","click",reset);}
}

async function buscar(){
  S.cedula=(document.getElementById("ced")||{}).value||"";
  const c=S.cedula.trim();
  if(!c){S.err="Ingrese su número de cédula.";R();return;}
  if(!DB[c]){S.err="Cédula no encontrada. Verifique el número o contacte a Gestión Humana.";R();return;}

  S.err="";
  S.emp=null;
  S.checkingCedula=true;
  R();

  try{
    const res=await validarCitaActivaPorCedula(c);
    if(res.hasActive){
      S.err=textoCitaActiva(res.reserva||{});
      S.emp=null;
      S.step=1;
      return;
    }

    S.emp=DB[c];
    S.step=2;
  }catch(e){
    S.err="No se pudo validar la cita activa en Google Sheets: "+e.message;
    S.emp=null;
    S.step=1;
  }finally{
    S.checkingCedula=false;
    R();
  }
}

R();
</script>
